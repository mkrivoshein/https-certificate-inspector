buildscript {
	repositories {
		maven { url "https://plugins.gradle.org/m2/" }
		maven { url "https://repo.spring.io/libs-release/" }
		mavenCentral()
		maven { url "https://repo.spring.io/milestone/" }
		maven { url "https://ajoberstar.org/bintray-backup/" }
	}
}

plugins {
	id 'org.springframework.boot' version '4.1.2'
	id "io.spring.dependency-management" version "1.1.7"
	id 'com.google.cloud.tools.jib' version '3.5.4'
	id 'java'
	id "application"
}

group = 'org.agencyapi'

ext {
	// Spring Cloud is not part of Spring Boot's BOM; 2025.1.2+ is required for Boot 4.1.x.
	set('spring-cloud.version', "2025.1.4")

	// commons-text is not managed by Spring Boot's (or Spring Cloud's) BOM, so its version is pinned here.
	set('commons-text.version', '1.15.0')

	// Everything else (Spring Framework, Tomcat, Micrometer, Micrometer Tracing, OpenTelemetry,
	// JUnit, SLF4J, commons-lang3) is managed by the Spring Boot BOM. Only pin a property here
	// if a CVE requires a newer version, with a comment and a note on when to remove it.
}

application {
	mainClass.set("org.agencyapi.x509.inspector.CertificateInspector")
}

jar {
	enabled = false
}

dependencies {
	// Spring Boot starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Observability and monitoring
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    //TODO: add implementation 'io.micrometer:micrometer-registry-prometheus' // For Prometheus metrics

    implementation 'dnsjava:dnsjava'
    implementation 'org.apache.commons:commons-text'
	implementation 'org.apache.commons:commons-lang3'

	implementation 'com.google.guava:guava:33.6.0-jre'

    // Annotations for static analysis
    implementation 'com.github.spotbugs:spotbugs-annotations:4.9.8' // Modern replacement for JSR305
    compileOnly 'org.jetbrains:annotations:26.1.0' // JetBrains annotations for better IDE support

    // Test dependencies
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}

	// Test runtime
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {dm ->
	applyMavenExclusions = false
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${ext.get('spring-cloud.version')}"
	}
	dependencies {
		dependency 'dnsjava:dnsjava:3.6.5'
		dependency "org.apache.commons:commons-text:${ext.get('commons-text.version')}"
	}
}



java {
	sourceCompatibility = 25
	targetCompatibility = 25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
		vendor = JvmVendorSpec.BELLSOFT
	}
}

test {
	useJUnitPlatform()
}

jib {
	from {
		image = 'bellsoft/liberica-runtime-container:jre-25-glibc'
	}
	to {
		image = 'europe-docker.pkg.dev/agencyapi/containers/https-certificate-inspector'
		project.afterEvaluate {
			def reconVersion = version.toString()
			if (!reconVersion.contains("-rc")) {
				tags = [version.toString(), 'latest']
			} else {
				tags = ['latest']
			}
		}
	}
	container {
		mainClass = "org.agencyapi.x509.inspector.CertificateInspector"
		ports = ['8001']
		format = 'OCI'

		creationTime = 'USE_CURRENT_TIMESTAMP'
	}
	allowInsecureRegistries = false
}
